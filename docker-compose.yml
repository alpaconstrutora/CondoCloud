version: '3.8'

services:
  # ──────────────────────────────────────────────────────────────
  # Redis — Filas Bull (queue_activation, queue_notifications, etc.)
  # ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: condocloud_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────
  # Redis Commander — UI para inspecionar filas em dev
  # Acesse: http://localhost:8081
  # ──────────────────────────────────────────────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: condocloud_redis_ui
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - '8081:8081'
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - tools

volumes:
  redis_data:
    driver: local

networks:
  default:
    name: condocloud_network
